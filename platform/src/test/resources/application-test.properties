# Test profile — used by @DataJpaTest and @SpringBootTest in test scope

# Use H2 in-memory for unit/slice tests
# For integration tests that need PostgreSQL features (JSONB, text[]),
# replace with Testcontainers — see ClinicIntegrationTest comment.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Disable security auto-config for slice tests (MockMvc handles it)
spring.security.user.name=test
spring.security.user.password=test