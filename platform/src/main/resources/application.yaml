# WHY YAML over .properties?
# YAML supports hierarchy — much cleaner for complex configs.
# The indentation visually communicates the structure.

spring:
  application:
    name: handyflow-platform

  modulith:
    events:
      republish-outstanding-events-on-restart: true

  datasource:
    url: jdbc:postgresql://localhost:5433/handyflow
    username: handyflow
    password: handyflow123
    hikari:
      # WHY: HikariCP is Spring Boot's default connection pool.
      # These settings prevent connection exhaustion under load.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      # WHY 'validate' not 'update'?
      # 'update' auto-modifies your DB schema — DANGEROUS in production.
      # 'validate' ensures your entities match the DB (Flyway manages changes).
      ddl-auto: validate
    show-sql: false  # true only during debugging — noisy in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # WHY: This is crucial for multi-tenancy later.
        # It prevents accidental cross-tenant data leakage.
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==================== Email — using Gmail SMTP (replace with real credentials) ====================
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: contract-sched-

# ==================== APPLICATION SETTINGS ====================
app:
  security:
    jwt:
      # FIX: was a hardcoded literal value, directly contradicting the
      # comment immediately above it ("NEVER hardcode in production"). Now
      # a required env var with no fallback — if JWT_SECRET isn't set, the
      # app fails to start with a clear error instead of silently signing
      # every token with a secret that was shared in a chat conversation.
      secret: ${JWT_SECRET}
      expiration-ms: 900000  # 15 minutes — this is the config change that
        # actually makes the refresh-token mechanism
        # built earlier this session matter day-to-day.
        # A 24h token made refresh a rarely-exercised
      # path; short-lived access + rotation is the
      # whole point of that design.
      refresh-expiration-ms: 604800000  # 7 days
    # NEW: closes the "client portal" gap. Deliberately a SEPARATE
    # secret from jwt.secret above — staff/admin tokens and portal
    # tokens are different trust boundaries (internal employees vs
    # external, untrusted clients). Same "no fallback" policy as
    # jwt.secret/encryption.key: PORTAL_JWT_SECRET must be a genuinely
    # random value distinct from JWT_SECRET, and a missing env var
    # should fail startup loudly, not silently reuse or default to
    # anything.
    portal-jwt:
      secret: ${PORTAL_JWT_SECRET}
      expiration-ms: 604800000  # 7 days — portal sessions are long-lived
        # by design (a client checking their fee notes monthly
        # shouldn't need to re-login every day), unlike the 15-minute
      # staff token above.
    encryption:
      # FIX: same issue as jwt.secret above — was a hardcoded literal.
      # No fallback default on purpose: this key encrypts sensitive data
      # (medicalNotes, knownThreats per the note below) and must never
      # silently run with a known/guessable value.
      key: ${ENCRYPTION_KEY}
  # IMPORTANT:
  # - In production, set JWT_SECRET and ENCRYPTION_KEY as real environment
  #   variables (or via your secrets manager) — never in this file.
  # - DO NOT commit real secret values to git — treat them like a DB password.
  # - Changing ENCRYPTION_KEY WITHOUT a migration script will make all existing
  #   encrypted principal data (medicalNotes, knownThreats) unreadable


  multitenancy:
    # Strategy: SCHEMA (each tenant gets own schema) vs
    # DISCRIMINATOR (shared tables with tenant_id column)
    # We start with DISCRIMINATOR for simplicity, migrate later
    strategy: DISCRIMINATOR

  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}

# ==================== ACTUATOR ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: when-authorized

# ==================== LOGGING ====================
logging:
  level:
    com.handyflow: DEBUG
    org.springframework.modulith: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
    # WHY: We include tenantId and userId in every log line.
    # This is called MDC (Mapped Diagnostic Context) — essential for debugging
    # multi-tenant issues in production.

# ==================== SWAGGER ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # WHY? Shows endpoints grouped by module/tag in the UI
    tags-sorter: alpha
    operations-sorter: alpha
    # WHY? Remembers your auth token between page refreshes
    persist-authorization: true
  # WHY? Shows the actual request being sent — great for debugging
  show-actuator: false

# ── Contracting module ────────────────────────────────────────────────────────
contracting:
  signing:
    # FIX: was ${CONTRACTING_SIGNING_SECRET:handyflow-signing-secret-CHANGE-IN-PRODUCTION}
    # — a weak, human-readable fallback that stayed silently active if the
    # env var was never set. This is the HMAC secret signing every
    # contract-signing token embedded in emailed URLs — if it leaked or was
    # guessed, someone could forge a valid signing link for any contract
    # without ever receiving one. No fallback now: a missing
    # CONTRACTING_SIGNING_SECRET fails startup loudly instead of quietly
    # running with a known value.
    secret: ${CONTRACTING_SIGNING_SECRET}
    base-url: ${FRONTEND_URL:http://localhost:5173}
    token-validity-hours: 72

  owner:
    # TODO: replace with dynamic lookup from tenant/user profile
    name: ${CONTRACTING_OWNER_NAME:HandyFlow Admin}
    # FIX: was ${CONTRACTING_OWNER_EMAIL:makgwale10111@gmail.com} — a specific
    # developer's personal Gmail address baked in as the silent fallback for
    # every tenant that forgets to configure this. Notifications about
    # contract declines/completions would go to that person's personal inbox
    # by default, for every tenant, forever — required now instead, so a
    # missing value fails startup loudly rather than leaking business
    # notifications to an unrelated personal account.
    email: ${CONTRACTING_OWNER_EMAIL}


# ── SMS provider ──────────────────────────────────────────────────────────────
# FIX §14: Changed matchIfMissing to false — sms.enabled must be explicitly set.
# - sms.enabled=false  → StubSmsService active (logs to console), OtpDevController enabled
# - sms.enabled=true   → BulkSmsSaService active, OtpDevController disabled

sms:
  enabled: ${SMS_ENABLED:false}          # set to true in production
  provider: bulksms                      # only bulksms implemented; add smsportal later
  bulksms:
    token-id: ${BULKSMS_TOKEN_ID:}
    token-secret: ${BULKSMS_TOKEN_SECRET:}
    sender-id: ${BULKSMS_SENDER_ID:HandyFlow}   # max 11 chars for alphanumeric sender ID

notifications:
  email:
    from-address: "no-reply@handyflow.dev"
    from-name: "HandyFlow (dev)"
  sms:
    # "log" (default) = LoggingSmsSender, safe no-op that logs instead of sending.
    # Set to "twilio" / "clickatell" / etc. once you implement and register a
    # real SmsSender bean guarded by @ConditionalOnProperty for that value.
    provider: "log"