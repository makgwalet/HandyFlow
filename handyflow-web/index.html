<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HandyFlow</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      // Phase 1 replaces localStorage-as-source-of-truth with the
      // ui-preferences API; this cache stays as the pre-paint hint.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          if (q === 'light' || q === 'dark' || q === 'system') localStorage.setItem('hf-theme', q);
          var pref = localStorage.getItem('hf-theme') || 'light';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
