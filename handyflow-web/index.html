<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HandyFlow</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      // The server (ui-preferences API) is the source of truth; ThemeProvider
      // writes these cache keys so the first paint already matches.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          if (q === 'light' || q === 'dark' || q === 'system') localStorage.setItem('hf-theme', q);
          var pref = localStorage.getItem('hf-theme') || 'light';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          var brand = JSON.parse(localStorage.getItem('hf-brand-vars') || 'null');
          var vars = brand && brand[dark ? 'dark' : 'light'];
          if (vars) for (var k in vars) if (k.indexOf('--hf-') === 0) root.style.setProperty(k, vars[k]);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
